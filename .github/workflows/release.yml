name: Release

# The version tag publishes the image first and deploys it afterwards. The deploy.yml of the service template cannot
# be used alone: nothing there publishes the :vX.Y.Z image that the deployment requires (specs/LAB-107, D-10).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
    # leandroAmariles, not lower case: the signature check of publish-image.yml is case sensitive (see ci.yml).
    uses: leandroAmariles/shoplab-ci/.github/workflows/publish-image.yml@v1
    with:
      image-name: 'ghcr.io/leandroamariles/gateway'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: publish
    uses: leandroamariles/shoplab-ci/.github/workflows/deploy.yml@v1
    with:
      service-name: 'gateway'
      image-tag: ${{ github.ref_name }}
      overlay: 'apps/gateway/overlays/dev'
    secrets:
      deploy-app-id: ${{ vars.DEPLOY_APP_ID }}
      deploy-app-private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
